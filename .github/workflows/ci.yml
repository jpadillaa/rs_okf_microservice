name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:17-bookworm@sha256:839fbb5a4942a7758dd93e18b42ea5649807491a0545b5eeeb8f0b8bb11857a5
        env:
          POSTGRES_USER: okf
          POSTGRES_PASSWORD: okf_test_password
          POSTGRES_DB: okf_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U okf -d okf_test"
          --health-interval 2s --health-timeout 3s --health-retries 30
    env:
      OKF_TEST_DATABASE_URL: postgresql://okf:okf_test_password@127.0.0.1:5432/okf_test?sslmode=disable
    steps:
      - uses: actions/checkout@v5
      # Debe coincidir con `rust-version` de Cargo.toml.
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.99"
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      # El renderizador PPTX necesita una fuente TrueType (ver render_font en src/pptx/mod.rs);
      # la misma versión que instala el Dockerfile.
      - name: Instalar fuente para el renderizado
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends fonts-dejavu-core=2.37-8
      - name: Formato
        run: cargo fmt --check
      - name: Clippy
        run: cargo clippy --all-targets --locked -- -D warnings
      - name: Pruebas
        run: cargo test --locked

  dependencies:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      # Licencias y orígenes según deny.toml; los avisos de seguridad van en scheduled.yml.
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check licenses sources

  image:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Construir la imagen
        run: docker build --build-arg OKF_BUILD_COMMIT="$(git rev-parse HEAD)" -t okf-microservice:smoke .
      # Una muestra de cada formato por la API, PostgreSQL, el conversor sin sockets y
      # la descarga de los cuatro bundles.
      - name: Prueba de humo
        run: tools/smoke.sh okf-microservice:smoke
