name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:17-bookworm@sha256:839fbb5a4942a7758dd93e18b42ea5649807491a0545b5eeeb8f0b8bb11857a5
        env:
          POSTGRES_USER: okf
          POSTGRES_PASSWORD: okf_test_password
          POSTGRES_DB: okf_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U okf -d okf_test"
          --health-interval 2s --health-timeout 3s --health-retries 30
    env:
      OKF_TEST_DATABASE_URL: postgresql://okf:okf_test_password@127.0.0.1:5432/okf_test?sslmode=disable
      # Los símbolos de depuración llenaban el disco al restaurar target/ en CI.
      # Solo cambia la información de depuración, no los checks del perfil de pruebas.
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
      # Las pruebas del OCR se omiten en local sin modelos; en la CI son obligatorias.
      OKF_REQUIRE_OCR_MODELS: "1"
    steps:
      - uses: actions/checkout@v5
      # Debe coincidir con `rust-version` de Cargo.toml.
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.99"
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          # No restaurar las cachés antiguas con símbolos completos.
          prefix-key: v1-rust-ci-no-debug
          cache-bin: false
          # Las PR leen la caché de `main` pero no escriben la suya: el límite de 10 GB
          # del repositorio expulsaba las cachés del fuzzing nocturno.
          save-if: ${{ github.ref == 'refs/heads/main' }}
      # El renderizador PPTX necesita una fuente TrueType (ver render_font en src/pptx/mod.rs);
      # la misma versión que instala el Dockerfile.
      - name: Instalar fuente para el renderizado
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends fonts-dejavu-core=2.37-8
      # Los modelos están fijados por SHA-256 en el script; la caché evita descargarlos
      # en cada ejecución y el script vuelve a verificarlos.
      - uses: actions/cache@v4
        with:
          path: models/ocr
          key: ocr-models-${{ hashFiles('tools/ocr_models.sh') }}
      - name: Modelos del OCR
        run: tools/ocr_models.sh models/ocr
      - name: Formato
        run: cargo fmt --check
      - name: Clippy
        run: cargo clippy --all-targets --locked -- -D warnings
      - name: Pruebas
        run: cargo test --locked

  dependencies:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      # Licencias y orígenes según deny.toml; los avisos de seguridad van en scheduled.yml.
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check licenses sources

  image:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v4
      - name: Construir la imagen
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: okf-microservice:smoke
          build-args: OKF_BUILD_COMMIT=${{ github.sha }}
          cache-from: type=gha,scope=okf-image-linux-amd64
          # Solo `main` escribe la caché de capas (las PR la leen); `mode=max` conserva la
          # etapa de dependencias de cargo-chef, que es la que ahorra la compilación.
          cache-to: ${{ github.ref == 'refs/heads/main' && 'type=gha,mode=max,scope=okf-image-linux-amd64' || '' }}
      # Una muestra de cada formato por la API, PostgreSQL, el conversor sin sockets y
      # la descarga de los cuatro bundles.
      - name: Prueba de humo
        run: tools/smoke.sh okf-microservice:smoke
