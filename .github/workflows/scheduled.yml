name: Programado

on:
  schedule:
    - cron: "0 5 * * *"
  workflow_dispatch:

jobs:
  advisories:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      # Avisos de seguridad de las dependencias; las excepciones justificadas están en deny.toml.
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check advisories

  fuzz:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        format: [pptx, docx, xlsx, pdf]
    steps:
      - uses: actions/checkout@v5
      # cargo-fuzz se compila con la versión estable de la CI normal: su lockfile fija
      # rustix 0.36.5, que en Linux activa `rustc_attrs` con nightly y no compila.
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.99"
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-11-01
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: fuzz -> target
          key: fuzz-${{ matrix.format }}
      - name: Herramientas y fuente
        run: |
          cargo +1.99 install cargo-fuzz --version 0.13.1 --locked
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends fonts-dejavu-core=2.37-8
      - uses: actions/cache@v5
        with:
          path: fuzz/corpus/${{ matrix.format }}
          key: fuzz-corpus-${{ matrix.format }}-${{ github.run_id }}
          restore-keys: fuzz-corpus-${{ matrix.format }}-
      - name: Semillas y dependencias fijadas
        run: |
          python3 tools/fuzz_seeds.py
          cargo fetch --manifest-path fuzz/Cargo.toml --locked
      - name: Cinco minutos por formato
        # `shell: bash` añade pipefail: sin él, `tee` ocultaba el fallo de cargo-fuzz y
        # un objetivo con pánico terminaba en verde.
        shell: bash
        env:
          CARGO_NET_OFFLINE: 'true'
          # Acota la cuarentena del instrumentador sin ampliar el límite RSS del servicio.
          ASAN_OPTIONS: quarantine_size_mb=32:thread_local_quarantine_size_kb=256:malloc_context_size=10
        run: |
          cargo +nightly-2026-11-01 fuzz run ${{ matrix.format }} --codegen-units 16 -- \
            -max_total_time=300 -timeout=300 -rss_limit_mb=500 -max_len=104857600 \
            2>&1 | tee fuzz/${{ matrix.format }}.log
      - name: Comprobar el lockfile
        if: always()
        run: git diff --exit-code -- Cargo.lock fuzz/Cargo.lock
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: fuzz-${{ matrix.format }}-${{ github.run_id }}
          path: |
            fuzz/artifacts/${{ matrix.format }}/
            fuzz/${{ matrix.format }}.log
          if-no-files-found: ignore
          retention-days: 14
