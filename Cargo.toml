[package]
name = "okf-microservice"
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
publish = false

[dependencies]
anyhow = "1"
axum = { version = "0.8", default-features = false, features = ["http1", "json", "multipart", "tokio", "tracing"] }
betteroffice-pptx = { version = "0.5", features = ["raster"] }
chrono = { version = "0.4", default-features = false, features = ["clock"] }
clap = { version = "4", features = ["derive"] }
dotenvy = "0.15"
libc = "0.2"
# `ocr-tract`: OCR de PaddleOCR en Rust puro (tract), activable con OKF_OCR_ENABLED.
pdf_oxide = { version = "0.3.78", features = ["rendering", "ocr-tract"] }
image = { version = "0.25", default-features = false, features = ["png"] }
quick-xml = "0.41"
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "tls-rustls-ring-native-roots", "postgres", "migrate", "macros"] }
rustix = { version = "1", features = ["fs", "process"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1", features = ["fs", "io-util", "macros", "process", "rt-multi-thread", "signal", "time"] }
# Sirve el bundle por partes, sin cargarlo entero en memoria.
tokio-util = { version = "0.7", default-features = false, features = ["io"] }
tempfile = "3"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
utoipa = "6"
utoipa-swagger-ui = { version = "10", default-features = false, features = ["axum", "vendored", "minified"] }
uuid = { version = "1", features = ["v4"] }
yaml_serde = "0.10.7"
zip = { version = "4", default-features = false, features = ["deflate"] }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
caseless = "0.2.2"
unicode-normalization = "0.1"
regex = "1"

# Las dependencias (renderizado PPTX, lectura PDF, ZIP) se optimizan también en las
# pruebas: los bundles de referencia convierten todos los ejemplos y en debug tardan
# más de un minuto.
[profile.dev.package."*"]
opt-level = 2

# Reduce el ejecutable distribuido sin cambiar la estrategia de optimización/LTO.
[profile.release]
strip = "symbols"

[target.'cfg(target_os = "linux")'.dependencies]
landlock = "0.4.7"
