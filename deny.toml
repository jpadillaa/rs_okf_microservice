# Auditoría de dependencias (plan 1, R9). La CI comprueba licencias y orígenes en cada
# push; los avisos de seguridad se comprueban en el flujo programado, para que un aviso
# nuevo no bloquee un push sin relación.

[graph]
all-features = false

[licenses]
# Licencias permisivas registradas en el stack (§5, regla 4). Una expresión con
# alternativas, como «MIT OR Apache-2.0 OR LGPL-2.1-or-later», se acepta si una de
# ellas está en la lista.
allow = [
    "0BSD",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "MIT",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
]
confidence-threshold = 0.9

[licenses.private]
# El propio paquete no se publica ni declara licencia.
ignore = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]

[bans]
multiple-versions = "allow"

[advisories]
# Cada excepción explica por qué el aviso no afecta al servicio; un aviso nuevo hace
# fallar el flujo programado hasta que se corrige o se justifica aquí.
ignore = [
    { id = "RUSTSEC-2026-0429", reason = "zip 4/8: solo afecta a ZipArchive::extract con enlaces simbólicos; ni el servicio ni betteroffice-opc llaman a extract, leen entradas en memoria. Revalidar si se incorpora extracción a disco" },
    { id = "RUSTSEC-2026-0367", reason = "zip: solo afecta a la extracción a disco (ZipArchive::extract, ZipStreamReader::extract), que el servicio no usa; los paquetes se leen entrada a entrada en memoria" },
    { id = "RUSTSEC-2026-0368", reason = "zip: solo afecta a ZipArchive::extract, que el servicio no usa" },
    { id = "RUSTSEC-2026-0369", reason = "zip: solo afecta a ZipArchive::extract y ZipStreamReader::extract, que el servicio no usa" },
    { id = "RUSTSEC-2026-0192", reason = "ttf-parser sin mantenimiento: dependencia del renderizador PPTX (betteroffice-pptx) sin versión alternativa publicada" },
    { id = "RUSTSEC-2026-0206", reason = "rustybuzz sin mantenimiento: dependencia del renderizador PPTX (betteroffice-pptx) sin versión alternativa publicada" },
    { id = "RUSTSEC-2026-0215", reason = "smallstr sin mantenimiento: dependencia del renderizador PPTX (betteroffice-pptx) sin versión alternativa publicada" },
]
